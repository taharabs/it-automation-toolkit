name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint module and examples
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
          $results = @(
            Invoke-ScriptAnalyzer -Path ./ITToolkit -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
            Invoke-ScriptAnalyzer -Path ./examples -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          )
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results.Count -gt 0) { throw "$($results.Count) analyzer finding(s)" }
          Write-Output 'No findings.'

  test:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7 on Linux
            os: ubuntu-latest
            shell: pwsh
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./build.ps1
      - name: Run tests (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./build.ps1
      - name: Build the sample report
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tools/New-SampleReport.ps1 -Path ./out/sample-report.html
      - name: Upload the sample report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: out/sample-report.html
